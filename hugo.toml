baseURL = "https://stdb.top/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "DB Blog"
theme = "PaperMod"
contentDir = "posts"
enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 120

[pagination]
pagerSize = 10

[outputs]
home = ["HTML", "RSS", "JSON"]

[taxonomies]
tag = "tags"
category = "categories"
series = "series"

[permalinks]
cloud-database-series = "/cloud-database-series/:slug/"

[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

[params]
defaultTheme = "auto"
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowAllPagesInArchive = true
ShowToc = true
TocOpen = false
mainSections = ["cloud-database-series"]

[params.homeInfoParams]
Title = "数据库技术博客"
Content = "聚焦云数据库的认知、选型、架构、性能、成本与迁移。"

[[menu.main]]
identifier = "archives"
name = "归档"
url = "/archives/"
weight = 10

[[menu.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 20

[[menu.main]]
identifier = "search"
name = "搜索"
url = "/search/"
weight = 30
