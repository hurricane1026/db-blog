baseURL = "https://stdb.top/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "数据库工程博客"
theme = "PaperMod"
enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 120

[pagination]
pagerSize = 10

[outputs]
home = ["HTML", "RSS", "JSON"]

[taxonomies]
tag = "tags"
category = "categories"
series = "series"

[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

[params]
defaultTheme = "auto"
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowAllPagesInArchive = true
ShowToc = true
TocOpen = false
mainSections = ["series"]
description = "聚焦云数据库、数据库架构、性能治理、成本控制与迁移实践的中文技术博客。"
keywords = ["数据库", "云数据库", "Lakehouse", "数据库架构", "性能治理", "成本优化", "数据平台"]

[[menu.main]]
identifier = "series"
name = "专题"
url = "/series/"
weight = 5

[[menu.main]]
identifier = "articles"
name = "文章"
url = "/articles/"
weight = 8

[[menu.main]]
identifier = "archives"
name = "归档"
url = "/archives/"
weight = 10

[[menu.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 20

[[menu.main]]
identifier = "search"
name = "搜索"
url = "/search/"
weight = 30
